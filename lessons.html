<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>منصة الطفرة - حصص العلوم</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f9f4; text-align: center; padding: 50px; }
        .lesson-container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #2e8b57; }
        .video-box { width: 100%; height: 400px; background: #000; color: white; display: flex; align-items: center; justify-content: center; border-radius: 10px; margin: 20px 0; }
        .btn-home { display: inline-block; padding: 10px 20px; background: #2e8b57; color: white; text-decoration: none; border-radius: 5px; }
    </style>
</head>
<body dir="rtl">

    <div id="adminPanel" style="display:none; background:#e3f2fd; padding:20px; border:2px dashed #2196f3; margin-bottom:20px; text-align:center; border-radius:15px;">
        <h2 style="color:#1565c0;">لوحة تحكم ميس ندى (توليد الأكواد)</h2>
        <button onclick="generateNewCode()" style="padding:15px 30px; background:#2196f3; color:white; border:none; border-radius:8px; cursor:pointer; font-weight:bold; font-size:18px;">+ توليد كود جديد للطالب</button>
        <div id="generatedCodeDisplay" style="margin-top:20px; font-size:24px; font-weight:bold; color:#d32f2f;"></div>
        <p style="font-size:12px; color:#666;">(انسخي الكود ده واديه للطالب.. الموقع هيقبله فوراً)</p>
    </div>

    <script>
        // 1. المعادلة السرية (أي كود بيبدأ بـ n/ وينتهي بـ T يعتبر صح)
        function isValidCode(code) {
            if (code === "Admin_Nada") {
                document.getElementById('adminPanel').style.display = 'block'; // بيفتحلك لوحة التحكم
                return true;
            }
            // المعادلة: لازم يبدأ بـ n/ ويكون طوله 7 حروف (مثال: n/1234T)
            if (code && code.startsWith("n/") && code.endsWith("T") && code.length === 8) {
                return true;
            }
            return false;
        }

        // 2. زرار توليد الأكواد (البلس)
        function generateNewCode() {
            let randomNum = Math.floor(1000 + Math.random() * 9000); // رقم عشوائي من 4 أرقام
            let newCode = "n/" + randomNum + "T";
            document.getElementById('generatedCodeDisplay').innerText = "الكود الجديد: " + newCode;
        }

        // 3. طلب الكود عند دخول الطالب
        let userEntry = prompt("أهلاً بك في منصة الطفرة.. ادخل كود الحصة:");

        if (isValidCode(userEntry)) {
            alert("كود صحيح! حصة ممتعة");
        } else {
            alert("كود خطأ! اطلب الكود من ميس ندى");
            window.location.href = "index.html";
        }
    </script>

    <div class="lesson-container" style="text-align: center; padding: 30px;">
        <h1 style="color: #2e8b57;">حصة 1: تركيب الخلية</h1>
        <div style="background: #000; height: 350px; border-radius: 15px; display: flex; align-items: center; justify-content: center; color: white;">
            <h3>فيديو الشرح (ميس ندى)</h3>
        </div>
        <br>
        <a href="index.html" style="color: #2e8b57; font-weight: bold;">العودة للرئيسية</a>
    </div>

</body>
</html>
