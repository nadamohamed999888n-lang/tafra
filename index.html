<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الطفرة - ميس ندى كامل</title>
    <style>
        :root { --primary: #1a237e; --secondary: #2196F3; --accent: #4CAF50; --homework: #ff9800; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f4f8; text-align: center; padding: 15px; direction: rtl; margin: 0; }
        .main-card { background: white; max-width: 500px; margin: 15px auto; padding: 25px; border-radius: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border-top: 10px solid var(--primary); }
        h1 { color: var(--primary); margin-bottom: 5px; font-size: 26px; }
        .tagline { color: #666; margin-bottom: 25px; font-weight: bold; font-size: 14px; }
        .btn { padding: 15px; border: none; border-radius: 12px; font-size: 17px; font-weight: bold; cursor: pointer; width: 100%; margin-bottom: 12px; transition: 0.3s; }
        .btn-stu { background: var(--accent); color: white; }
        .btn-homework { background: var(--homework); color: white; }
        .btn-adm { background: var(--secondary); color: white; font-size: 13px; opacity: 0.9; }
        .input-group { text-align: right; margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: var(--primary); }
        input, select { padding: 12px; width: 100%; border-radius: 10px; border: 2px solid #eee; box-sizing: border-box; outline: none; font-size: 16px; }
        #registrationPage, #adminPanel, #lessonPage, #homeworkPage { display: none; }
        .codes-box { background: #e3f2fd; padding: 15px; border-radius: 15px; text-align: right; border: 1px dashed var(--secondary); }
        video { width: 100%; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); margin-top: 15px; }
        .back-link { color: var(--secondary); cursor: pointer; font-weight: bold; display: inline-block; margin-top: 15px; text-decoration: underline; }
    </style>
</head>
<body oncontextmenu="return false;">

<div class="main-card">
    <h1>🚀 منصة الطفرة</h1>
    <p class="tagline">للعلوم مع ميس ندى كامل</p>

    <div id="startPage">
        <button class="btn btn-stu" onclick="showPage('registrationPage')">دخول الطالب للحصة 🎬</button>
        <button class="btn btn-homework" onclick="showPage('homeworkPage')">تسليم الواجب 📚</button>
        <button class="btn btn-adm" onclick="accessAdmin()">لوحة تحكم المعلمة ⚙️</button>
    </div>

    <div id="registrationPage">
        <h3>تسجيل بيانات الطالب</h3>
        <div class="input-group">
            <label>الاسم بالكامل:</label>
            <input type="text" id="stuName" placeholder="اكتب اسمك الثلاثي">
        </div>
        <div class="input-group">
            <label>المرحلة الدراسية:</label>
            <select id="stuStage">
                <option value="1">أولى إعدادي</option>
                <option value="2">تانية إعدادي</option>
                <option value="3">تالتة إعدادي</option>
            </select>
        </div>
        <div class="input-group">
            <label>كود الحصة:</label>
            <input type="text" id="stuCode" placeholder="ادخل الكود المستلم من الميس">
        </div>
        <button class="btn btn-stu" onclick="startLesson()">دخول الحصة 🔬</button>
        <span class="back-link" onclick="showPage('startPage')">رجوع للرئيسية</span>
    </div>

    <div id="homeworkPage">
        <h3>تسليم الواجب المنزلي</h3>
        <div class="input-group">
            <label>اسم الطالب:</label>
            <input type="text" placeholder="اكتب اسمك">
        </div>
        <div class="input-group">
            <label>ارفع صورة الواجب:</label>
            <input type="file" accept="image/*">
        </div>
        <button class="btn btn-homework" onclick="alert('تم إرسال الواجب لميس ندى بنجاح!')">إرسال الواجب ✅</button>
        <br><span class="back-link" onclick="showPage('startPage')">رجوع</span>
    </div>

    <div id="adminPanel">
        <div class="codes-box">
            <p style="font-weight: bold; color: var(--primary);">قائمة أكواد الحصص المعتمدة:</p>
            <div id="codesList" style="background:white; padding:10px; border-radius:10px; font-size:14px;"></div>
        </div>
        <button class="btn" style="background:#666; color:white; margin-top:15px;" onclick="showPage('startPage')">خروج</button>
    </div>

    <div id="lessonPage">
        <h3 id="lessonTitle" style="color:var(--secondary)">🎬 حصتنا النهاردة</h3>
        <video id="myVideo" controls controlsList="nodownload">
            <source id="videoSource" src="" type="video/mp4">
        </video>
        <button class="btn" style="margin-top:20px; background:#eee;" onclick="location.reload()">إنهاء المشاهدة</button>
    </div>
</div>

<script>
    // الأكواد الثابتة (عدليها براحتك من هنا)
    const myFixedCodes = {
        1: ['P1-NAD-77', 'P1-XYZ-12', 'CODE-101'], // أولى
        2: ['P2-NAD-88', 'P2-ABC-34', 'CODE-202'], // تانية
        3: ['P3-NAD-99', 'P3-HJK-56', 'CODE-303']  // تالتة
    };

    function showPage(pageId) {
        document.querySelectorAll('.main-card > div').forEach(div => div.style.display = 'none');
        document.getElementById(pageId).style.display = 'block';
    }

    function accessAdmin() {
        let pass = prompt("من فضلك ادخلي كلمة السر:");
        if (pass === "1332005k") {
            showPage('adminPanel');
            let h = "";
            for(let s in myFixedCodes) {
                h += `<b>مرحلة ${s}:</b> ${myFixedCodes[s].join(' - ')}<br><hr>`;
            }
            document.getElementById('codesList').innerHTML = h;
        } else if (pass !== null) { alert("كلمة السر خطأ!"); }
    }

    function startLesson() {
        const name = document.getElementById('stuName').value;
        const stage = document.getElementById('stuStage').value;
        const code = document.getElementById('stuCode').value.trim().toUpperCase();

        if (name && myFixedCodes[stage].includes(code)) {
            showPage('lessonPage');
            document.getElementById('videoSource').src = "lesson" + stage + ".mp4";
            document.getElementById('myVideo').load();
        } else {
            alert("تأكد من كتابة الاسم واختيار المرحلة والكود الصحيح!");
        }
    }
</script>
</body>
</html>
