<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الطفرة - ميس ندى كامل</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f0f7ff; text-align: center; padding: 15px; direction: rtl; }
        .container { background: white; max-width: 500px; margin: 20px auto; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border-top: 8px solid #2196F3; }
        h1 { color: #1a237e; font-size: 24px; margin-bottom: 20px; }
        .main-choice { display: flex; flex-direction: column; gap: 15px; }
        .btn { padding: 15px; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; width: 100%; }
        .btn-student { background-color: #4CAF50; color: white; }
        .btn-admin { background-color: #2196F3; color: white; margin-top: 20px; font-size: 14px; }
        .form-group { text-align: right; margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { padding: 12px; width: 95%; border-radius: 10px; border: 1px solid #ddd; font-size: 16px; outline: none; }
        #registrationPage, #adminPanel, #lessonPage { display: none; }
        .admin-box { background: #e3f2fd; padding: 15px; border-radius: 15px; margin-bottom: 20px; border: 2px solid #2196F3; }
        video { width: 100%; border-radius: 15px; margin-top: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .code-res { color: #d32f2f; font-weight: bold; margin-top: 10px; font-size: 18px; background: white; padding: 5px; border-radius: 5px; }
    </style>
</head>
<body oncontextmenu="return false;">

<div class="container">
    <h1>🚀 منصة الطفرة للعلوم</h1>
    <p style="margin-top: -15px; color: #666;">ميس ندى كامل</p>

    <div id="startPage" class="main-choice">
        <button class="btn btn-student" onclick="showRegistration()">أنا طالب (تسجيل دخول)</button>
        <button class="btn btn-admin" onclick="accessAdmin()">دخول الآدمن (ميس ندى)</button>
    </div>

    <div id="registrationPage">
        <h3>تسجيل بيانات الطالب</h3>
        <div class="form-group">
            <label>الاسم بالكامل:</label>
            <input type="text" id="stuName" placeholder="اكتب اسمك الثلاثي">
        </div>
        <div class="form-group">
            <label>المرحلة الدراسية:</label>
            <select id="stuStage">
                <option value="1">أولى إعدادي</option>
                <option value="2">تانية إعدادي</option>
                <option value="3">تالتة إعدادي</option>
            </select>
        </div>
        <div class="form-group">
            <label>كود الحصة:</label>
            <input type="text" id="stuCode" placeholder="ادخل كود الحصة">
        </div>
        <button class="btn btn-student" onclick="validateStudent()">دخول للحصة 🔬</button>
        <button style="margin-top:15px; background:none; border:none; color:#2196F3; cursor:pointer; font-weight:bold;" onclick="goBack()">← رجوع للرئيسية</button>
    </div>

    <div id="adminPanel">
        <div class="admin-box">
            <p style="font-weight: bold; color: #1a237e;">توليد أكواد جديدة:</p>
            <div style="display: flex; gap: 5px; justify-content: center;">
                <button class="btn-admin" style="width:30%; padding: 10px;" onclick="generateCode(1)">أولى</button>
                <button class="btn-admin" style="width:30%; padding: 10px;" onclick="generateCode(2)">تانية</button>
                <button class="btn-admin" style="width:30%; padding: 10px;" onclick="generateCode(3)">تالتة</button>
            </div>
            <div id="displayCode" class="code-res" style="display:none;"></div>
        </div>
        <button class="btn" style="background:#f44336; color:white;" onclick="goBack()">تسجيل خروج</button>
    </div>

    <div id="lessonPage">
        <h2 id="lessonTitle" style="color: #2196F3;">🎬 حصتنا النهاردة</h2>
        <video id="myVideo" controls controlsList="nodownload">
            <source id="videoSource" src="" type="video/mp4">
            متصفحك لا يدعم تشغيل الفيديو.
        </video>
        <button class="btn" style="margin-top:20px; background:#ddd" onclick="location.reload()">إنهاء المشاهدة</button>
    </div>
</div>

<script>
    // الأكواد الافتراضية لو مفيش أكواد محفوظة
    let allCodes = JSON.parse(localStorage.getItem('allStagesCodes')) || { 1: ['N1'], 2: ['N2'], 3: ['N3'] };

    function showRegistration() {
        document.getElementById('startPage').style.display = 'none';
        document.getElementById('registrationPage').style.display = 'block';
    }

    function goBack() {
        document.getElementById('registrationPage').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'none';
        document.getElementById('startPage').style.display = 'flex';
    }

    function accessAdmin() {
        let pass = prompt("من فضلك ادخلي كلمة سر الآدمن:");
        if (pass === "1332005k") {
            document.getElementById('startPage').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
        } else if (pass !== null) {
            alert("كلمة السر خطأ!");
        }
    }

    function generateCode(s) {
        const c = 'Prep' + s + '-' + Math.random().toString(36).substr(2, 4).toUpperCase();
        allCodes[s].push(c);
        localStorage.setItem('allStagesCodes', JSON.stringify(allCodes));
        const res = document.getElementById('displayCode');
        res.innerText = "كود جديد: " + c;
        res.style.display = 'block';
    }

    function validateStudent() {
        const name = document.getElementById('stuName').value.trim();
        const stage = document.getElementById('stuStage').value;
        const code = document.getElementById('stuCode').value.trim();

        if (name === "" || code === "") {
            alert("لازم تكتب اسمك والكود يا بطل!");
            return;
        }

        if (allCodes[stage].includes(code)) {
            document.getElementById('registrationPage').style.display = 'none';
            document.getElementById('lessonPage').style.display = 'block';
            document.getElementById('videoSource').src = "lesson" + stage + ".mp4";
            document.getElementById('myVideo').load();
        } else {
            alert("الكود ده غلط أو مش بتاع مرحلتك!");
        }
    }
</script>
</body>
</html>
