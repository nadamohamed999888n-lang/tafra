<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الطفرة - مس ندى كامل</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f4f8; text-align: center; padding: 20px; direction: rtl; }
        .container { background: white; max-width: 700px; margin: 40px auto; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-top: 6px solid #2196F3; }
        h1 { color: #1a237e; font-size: 28px; }
        p { color: #555; font-size: 18px; }
        .input-group { margin: 30px 0; }
        input { padding: 15px; width: 70%; border: 2px solid #ddd; border-radius: 12px; font-size: 18px; outline: none; transition: 0.3s; }
        input:focus { border-color: #2196F3; }
        button { padding: 15px 30px; background: #2196F3; color: white; border: none; border-radius: 12px; cursor: pointer; font-size: 18px; font-weight: bold; margin-top: 15px; width: 75%; }
        button:hover { background: #1976D2; }
        #videoArea { display: none; margin-top: 30px; animation: fadeIn 1s; }
        iframe { width: 100%; height: 400px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div class="container">
    <h1>🚀 منصة الطفرة للعلوم</h1>
    <p>مرحباً بك يا بطل في حصة الأسبوع.. أدخل الكود لتبدأ!</p>

    <div id="loginArea">
        <input type="text" id="studentCode" placeholder="اكتب كود الحصة هنا..">
        <br>
        <button onclick="checkCode()">دخول الحصة 🔬</button>
    </div>

    <div id="videoArea">
        <h2 style="color: #2196F3;">حصة: تركيب الخلية</h2>
        <iframe id="videoFrame" src="" frameborder="0" allowfullscreen></iframe>
    </div>
</div>

<script>
function checkCode() {
    const code = document.getElementById('studentCode').value.trim();
    
    // قائمة الأكواد (تقدري تزودي أكواد تانية هنا)
    const validCodes = ['Admin_Nada', 'Tafra-001', 'Tafra-002', 'Tafra-003']; 

    if (validCodes.includes(code)) {
        document.getElementById('loginArea').style.display = 'none';
        document.getElementById('videoArea').style.display = 'block';
        
        // أول ما ترفعي الفيديو على يوتيوب.. شيلي الكلمة اللي تحت وحطي رقم الفيديو
        // مثال: لو لينك الفيديو https://youtu.be/12345 فـ الرقم هو 12345
        document.getElementById('videoFrame').src = "https://www.youtube.com/embed/اكتبي_رقم_الفيديو_هنا";
    } else {
        alert("يا بطل الكود ده غلط.. راجع ميس ندى!");
    }
}
</script>

</body>
</html>
