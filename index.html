<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الطفرة - ميس ندى كامل</title>
    <style>
        :root { --primary: #1a237e; --secondary: #2196F3; --accent: #4CAF50; --homework: #ff9800; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f4f8; text-align: center; padding: 15px; direction: rtl; margin: 0; }
        .main-card { background: white; max-width: 500px; margin: 15px auto; padding: 25px; border-radius: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border-top: 10px solid var(--primary); }
        h1 { color: var(--primary); margin-bottom: 5px; font-size: 26px; }
        .tagline { color: #666; margin-bottom: 25px; font-weight: bold; font-size: 14px; }
        .btn { padding: 15px; border: none; border-radius: 12px; font-size: 17px; font-weight: bold; cursor: pointer; width: 100%; margin-bottom: 12px; transition: 0.3s; }
        .btn-stu { background: var(--accent); color: white; }
        .btn-homework { background: var(--homework); color: white; }
        .btn-gen { background: var(--secondary); color: white; padding: 10px; font-size: 14px; width: 30%; margin: 5px; }
        .input-group { text-align: right; margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: var(--primary); }
        input, select { padding: 12px; width: 100%; border-radius: 10px; border: 2px solid #eee; box-sizing: border-box; outline: none; }
        #registrationPage, #adminPanel, #lessonPage, #homeworkPage { display: none; }
        .admin-box { background: #e3f2fd; padding: 15px; border-radius: 15px; border: 2px solid var(--secondary); margin-bottom: 15px; }
        video { width: 100%; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); margin-top: 15px; }
        .code-display { font-size: 18px; color: #d32f2f; font-weight: bold; margin-top: 10px; background: white; padding: 5px; border-radius: 5px; }
        .back-link { color: var(--secondary); cursor: pointer; font-weight: bold; display: inline-block; margin-top: 15px; }
    </style>
</head>
<body oncontextmenu="return false;">

<div class="main-card">
    <h1>🚀 منصة الطفرة</h1>
    <p class="tagline">للعلوم مع ميس ندى كامل</p>

    <div id="startPage">
        <button class="btn btn-stu" onclick="showPage('registrationPage')">دخول الطالب 📝</button>
        <button class="btn btn-homework" onclick="showPage('homeworkPage')">تسليم الواجب 📚</button>
        <button class="btn" style="background:#666; color:white;" onclick="accessAdmin()">لوحة التحكم (توليد الأكواد) ⚙️</button>
    </div>

    <div id="registrationPage">
        <div class="input-group">
            <label>اسم الطالب:</label>
            <input type="text" id="stuName" placeholder="اكتب اسمك الثلاثي">
        </div>
        <div class="input-group">
            <label>المرحلة الدراسية:</label>
            <select id="stuStage">
                <option value="1">أولى إعدادي</option>
                <option value="2">تانية إعدادي</option>
                <option value="3">تالتة إعدادي</option>
            </select>
        </div>
        <div class="input-group">
            <label>كود الحصة:</label>
            <input type="text" id="stuCode" placeholder="ادخل الكود">
        </div>
        <button class="btn btn-stu" onclick="startLesson()">مشاهدة الحصة</button>
        <span class="back-link" onclick="showPage('startPage')">رجوع</span>
    </div>

    <div id="homeworkPage">
        <h3>رفع الواجب</h3>
        <input type="file" style="margin-bottom:10px;">
        <button class="btn btn-homework" onclick="alert('تم الإرسال!')">إرسال ✅</button>
        <span class="back-link" onclick="showPage('startPage')">رجوع</span>
    </div>

    <div id="adminPanel">
        <div class="admin-box">
            <p style="font-weight: bold;">توليد أكواد جديدة:</p>
            <button class="btn-gen" onclick="generateCode(1)">أولى</button>
            <button class="btn-gen" onclick="generateCode(2)">تانية</button>
            <button class="btn-gen" onclick="generateCode(3)">تالتة</button>
            <div id="newCode" class="code-display" style="display:none;"></div>
        </div>
        <button class="btn" style="background:#444; color:white;" onclick="showPage('startPage')">خروج</button>
    </div>

    <div id="lessonPage">
        <video id="myVideo" controls controlsList="nodownload">
            <source id="videoSource" src="" type="video/mp4">
        </video>
        <button class="btn" style="margin-top:20px; background:#eee;" onclick="location.reload()">خروج</button>
    </div>
</div>

<script>
    // نظام حفظ وتوليد الأكواد
    let allCodes = JSON.parse(localStorage.getItem('savedCodes')) || { 1: ['N1'], 2: ['N2'], 3: ['N3'] };

    function showPage(p) {
        document.querySelectorAll('.main-card > div').forEach(div => div.style.display = 'none');
        document.getElementById(p).style.display = 'block';
    }

    function accessAdmin() {
        let p = prompt("الباسورد:");
        if (p === "1332005k") showPage('adminPanel');
    }

    function generateCode(s) {
        const c = 'TAFRA-' + s + '-' + Math.random().toString(36).substr(2, 4).toUpperCase();
        allCodes[s].push(c);
        localStorage.setItem('savedCodes', JSON.stringify(allCodes));
        document.getElementById('newCode').innerText = "كود جديد: " + c;
        document.getElementById('newCode').style.display = 'block';
    }

    function startLesson() {
        const name = document.getElementById('stuName').value;
        const stage = document.getElementById('stuStage').value;
        const code = document.getElementById('stuCode').value.trim().toUpperCase();

        if (name && allCodes[stage].includes(code)) {
            showPage('lessonPage');
            document.getElementById('videoSource').src = "lesson" + stage + ".mp4";
            document.getElementById('myVideo').load();
        } else { alert("الكود خطأ!"); }
    }
</script>
</body>
</html>
